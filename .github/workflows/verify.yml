name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: apps/cli-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Go language server
        run: mkdir -p .tools/bin && GOBIN="$PWD/.tools/bin" go install golang.org/x/tools/gopls@v0.23.0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output /tmp/gitleaks-checksums.txt
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks-checksums.txt \
            | sed 's#  gitleaks_#  /tmp/gitleaks_#' \
            | sed 's#\.tar\.gz#\.tar.gz#' \
            | sed 's#/tmp/gitleaks_[^ ]*#/tmp/gitleaks.tar.gz#' \
            | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Verify candidate
        run: ./scripts/verify-candidate --ci
  hardener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: apps/cli-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm quality:crap
      - run: pnpm quality:dead-code
      - run: pnpm quality:api
      - run: pnpm test:go:race
      - run: pnpm test:mutation
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
